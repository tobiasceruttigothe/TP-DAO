services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: biblioteca
      POSTGRES_PASSWORD: biblioteca
      POSTGRES_DB: biblioteca
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U biblioteca -d biblioteca"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg2://biblioteca:biblioteca@db:5432/biblioteca
      TEST_DATABASE_URL: postgresql+psycopg2://biblioteca:biblioteca@db:5432/biblioteca_test
      CORS_ORIGENES: ${CORS_ORIGENES:-http://localhost:3000,http://localhost:5173,http://localhost:4200}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
