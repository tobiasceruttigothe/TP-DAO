services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: biblioteca
      POSTGRES_PASSWORD: biblioteca
      POSTGRES_DB: biblioteca
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U biblioteca -d biblioteca"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg2://biblioteca:biblioteca@db:5432/biblioteca
      TEST_DATABASE_URL: postgresql+psycopg2://biblioteca:biblioteca@db:5432/biblioteca_test
      CORS_ORIGENES: ${CORS_ORIGENES:-http://localhost:3000,http://localhost:5173,http://localhost:4200}
      URL_FRONTEND: ${URL_FRONTEND:-http://localhost:3000}
      JWT_SECRETO: ${JWT_SECRETO:-cambiar-este-secreto-en-el-env-para-produccion}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_CONTRASENA: ${ADMIN_CONTRASENA:-admin123}
      # Por defecto los correos van a Mailpit (http://localhost:8025). Para Gmail ver .env.example
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PUERTO: ${SMTP_PUERTO:-1025}
      SMTP_USUARIO: ${SMTP_USUARIO:-}
      SMTP_CONTRASENA: ${SMTP_CONTRASENA:-}
      SMTP_TLS: ${SMTP_TLS:-false}
      CORREO_REMITENTE: ${CORREO_REMITENTE:-Red de Bibliotecas <no-responder@example.com>}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started

  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:${API_PORT:-8000}
    ports:
      - "${WEB_PORT:-3000}:80"
    depends_on:
      - api

  # Administrador de la base desde el navegador: http://localhost:5050
  pgadmin:
    image: dpage/pgadmin4:8.14
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
      # Modo escritorio: entra directo, sin pantalla de login
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      PGADMIN_LISTEN_ADDRESS: 0.0.0.0
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - ./docker/pgadmin-servers.json:/pgadmin4/servers.json:ro
      - pgadmin:/var/lib/pgadmin
    depends_on:
      - db

  # Buzon de prueba: recibe todos los correos que manda el sistema, sin enviarlos a nadie.
  # Bandeja en http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.30
    ports:
      - "${MAILPIT_PORT:-8025}:8025"

volumes:
  pgdata:
  pgadmin:
