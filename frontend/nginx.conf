server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Las rutas de React (/prestamos, /remitos/3, ...) se resuelven en el navegador
    location / {
        try_files $uri /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
